<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cloud Claw Machine - 云端抓娃娃机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;color:#fff;overflow-x:hidden;padding:8px}
h1{font-size:1.8rem;margin:4px 0;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:.85rem;color:#aaa;margin-bottom:6px}
#gc{position:relative;border:3px solid #555;border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(255,210,0,.15),inset 0 0 60px rgba(0,0,0,.4);background:#1a1a2e}
canvas{display:block}
.hud{display:flex;justify-content:space-between;width:100%;max-width:600px;padding:6px 0;font-size:.9rem;flex-wrap:wrap;gap:4px}
.hud span{background:rgba(255,255,255,.08);padding:3px 12px;border-radius:20px;font-weight:600;white-space:nowrap}
.ctrl{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctrl button{padding:10px 20px;font-size:1rem;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:transform .1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ctrl button:active{transform:scale(.95)}
.bl,.br{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.bd{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;min-width:110px}
.brs{background:rgba(255,255,255,.12);color:#ccc}
.bm{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;font-size:.85rem;padding:8px 14px}
.inst{margin-top:6px;font-size:.75rem;color:#666;text-align:center}
.mode-bar{margin-top:6px;display:flex;gap:6px;justify-content:center}
.mode-bar button{padding:6px 14px;font-size:.8rem;border:2px solid transparent;border-radius:20px;cursor:pointer;font-weight:600;background:rgba(255,255,255,.08);color:#aaa;transition:all .2s}
.mode-bar button.active{border-color:#ffd200;color:#ffd200;background:rgba(255,210,0,.1)}
.powerup-indicator{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-direction:column}
.pu-item{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:12px;font-size:.75rem;color:#fff;display:none}
.pu-item.active{display:block;animation:puPulse 1s ease-in-out infinite}
@keyframes puPulse{0%,100%{opacity:1}50%{opacity:.6}}
.gallery{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gallery .gi{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;position:relative;transition:all .3s}
.gi.locked{background:rgba(255,255,255,.05);filter:grayscale(1) brightness(.3)}
.gi.unlocked{background:rgba(255,210,0,.15);border:1px solid rgba(255,210,0,.3)}
.gi .pts{position:absolute;bottom:-2px;right:2px;font-size:.5rem;color:#ffd200}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;padding:10px 24px;border-radius:30px;font-weight:700;font-size:1rem;transition:transform .4s cubic-bezier(.34,1.56,.64,1);z-index:100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.combo-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:3rem;font-weight:900;color:#ffd200;text-shadow:0 0 20px rgba(255,210,0,.8);opacity:0;pointer-events:none;transition:all .3s}
.combo-display.active{opacity:1;animation:comboPulse .5s ease-out}
@keyframes comboPulse{0%{transform:translate(-50%,-50%) scale(2);opacity:0}50%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes neonPulse{0%,100%{box-shadow:0 0 20px rgba(255,210,0,.15),inset 0 0 60px rgba(0,0,0,.4)}50%{box-shadow:0 0 40px rgba(255,210,0,.3),0 0 80px rgba(102,126,234,.2),inset 0 0 60px rgba(0,0,0,.4)}}
#gc{animation:neonPulse 3s ease-in-out infinite}
.stats-toggle{margin-top:8px;padding:6px 16px;font-size:.8rem;border:1px solid rgba(255,255,255,.15);border-radius:20px;cursor:pointer;background:rgba(255,255,255,.05);color:#aaa;transition:all .2s}
.stats-toggle:hover{background:rgba(255,255,255,.1);color:#fff}
.stats-panel{display:none;margin-top:6px;background:rgba(255,255,255,.05);border-radius:12px;padding:12px 16px;max-width:600px;width:100%;font-size:.8rem}
.stats-panel.open{display:block}
.stats-panel h3{font-size:.9rem;color:#ffd200;margin-bottom:6px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.stat-item{background:rgba(255,255,255,.05);border-radius:8px;padding:6px 10px}
.stat-item .label{color:#888;font-size:.7rem}
.stat-item .value{color:#fff;font-size:1rem;font-weight:700}
.achievements{margin-top:8px}
.ach-item{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border-radius:16px;padding:3px 10px;margin:2px;font-size:.7rem}
.ach-item.earned{background:rgba(255,210,0,.12);border:1px solid rgba(255,210,0,.2)}
.ach-item.locked{opacity:.4}
</style>
</head>
<body>
<h1>Cloud Claw Machine</h1>
<p class="sub">云端抓娃娃机 - 键盘/触屏操控</p>
<div class="hud">
<span>🪙 <b id="hCoins">5</b></span>
<span>🧸 <b id="hScore">0</b></span>
<span>🏆 <b id="hHigh">0</b></span>
<span>⚡ Lv.<b id="hLevel">1</b></span>
<span>🔥 x<b id="hCombo">0</b></span>
<span id="hTimer" style="display:none">⏱ <b id="hTime">60</b>s</span>
</div>
<div id="gc" style="position:relative">
<canvas id="cv"></canvas>
<div class="combo-display" id="comboDisp"></div>
<div class="powerup-indicator">
<div class="pu-item" id="puGrip">💪 强力爪</div>
<div class="pu-item" id="puMagnet">🧲 磁力</div>
<div class="pu-item" id="puDouble">💎 双倍</div>
</div>
</div>
<div class="ctrl">
<button class="bl" id="bL">◀ 左</button>
<button class="bd" id="bD">⬇ 抓!</button>
<button class="br" id="bR">▶ 右</button>
<button class="brs" id="bRs">🔄 重来</button>
</div>
<div class="mode-bar">
<button class="active" id="mNormal">🎮 经典</button>
<button id="mChallenge">⏱ 限时挑战</button>
<button id="mZen">🧘 无限</button>
</div>
<p class="inst">← → 移动 | 空格/↓ 抓取 | R 重来 | 1/2/3 切换模式</p>
<div class="gallery" id="gallery"></div>
<button class="stats-toggle" id="statsBtn">📊 统计 / 成就</button>
<div class="stats-panel" id="statsPanel">
<h3>📊 游戏统计</h3>
<div class="stats-grid" id="statsGrid"></div>
<h3 style="margin-top:8px">🏅 成就</h3>
<div class="achievements" id="achList"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
const W=Math.min(600,innerWidth-16),H=Math.min(480,innerHeight-280);
cv.width=W;cv.height=H;
document.getElementById("gc").style.width=W+"px";

// Audio context (lazy init on first interaction)
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  g.gain.value=vol||.15;
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxMove(){playTone(300,.05,"square",.05)}
function sfxDrop(){playTone(200,.3,"sawtooth",.1)}
function sfxGrab(){playTone(500,.15,"sine",.12);setTimeout(()=>playTone(700,.15,"sine",.1),100)}
function sfxWin(){playTone(523,.1,"sine",.15);setTimeout(()=>playTone(659,.1,"sine",.15),100);setTimeout(()=>playTone(784,.2,"sine",.15),200)}
function sfxFail(){playTone(200,.3,"sawtooth",.1);setTimeout(()=>playTone(150,.3,"sawtooth",.08),150)}
function sfxGameOver(){playTone(400,.2,"sine",.12);setTimeout(()=>playTone(300,.2,"sine",.1),200);setTimeout(()=>playTone(200,.4,"sine",.08),400)}
function sfxCoin(){playTone(880,.1,"sine",.1);setTimeout(()=>playTone(1100,.15,"sine",.1),80)}
function sfxPowerup(){playTone(600,.08,"sine",.12);setTimeout(()=>playTone(800,.08,"sine",.12),60);setTimeout(()=>playTone(1000,.12,"sine",.12),120)}
function sfxTick(){playTone(1000,.03,"square",.05)}

// Prize types
const TYPES=[
  {emoji:"🧸",name:"小熊",color:"#c0392b",pts:10,sz:30,w:3},
  {emoji:"🐰",name:"兔子",color:"#e74c3c",pts:15,sz:28,w:2.5},
  {emoji:"🐱",name:"猫咪",color:"#f39c12",pts:20,sz:26,w:2},
  {emoji:"🦊",name:"狐狸",color:"#e67e22",pts:25,sz:28,w:1.5},
  {emoji:"🐼",name:"熊猫",color:"#2c3e50",pts:30,sz:32,w:1},
  {emoji:"🦄",name:"独角兽",color:"#9b59b6",pts:50,sz:34,w:.5},
  {emoji:"⭐",name:"金星",color:"#f1c40f",pts:100,sz:24,w:.2},
];

// State
let prizes=[],particles=[],floatTexts=[],stars=[];
let claw={x:W/2,y:60,open:.5,state:"idle",targetY:0,grabbed:null,speed:3,grabTimer:0,swing:0,swingV:0};
let coins=5,score=0,highScore=+(localStorage.getItem("clawHS")||0),level=1,combo=0,gameOver=false,shakeT=0;
let keys={},collected=new Set(JSON.parse(localStorage.getItem("clawColl")||"[]"));
let frameCount=0;
// Game modes: "normal", "challenge", "zen"
let gameMode="normal";
let timer=60,timerInterval=null,lastTimerTick=0;
// Power-ups
let powerups={grip:0,magnet:0,double:0}; // remaining frames
// Power-up items on field
let puItems=[];

// Persistent stats
let stats=JSON.parse(localStorage.getItem("clawStats")||'{"totalGrabs":0,"totalMiss":0,"totalGames":0,"totalScore":0,"maxCombo":0,"maxLevel":0,"prizeCounts":{}}');
function saveStats(){localStorage.setItem("clawStats",JSON.stringify(stats))}

// Achievements
const ACHIEVEMENTS=[
  {id:"first",name:"初次体验",desc:"完成第一局",icon:"🎮",check:()=>stats.totalGames>=1},
  {id:"10grabs",name:"小能手",desc:"累计抓到10个",icon:"🧸",check:()=>stats.totalGrabs>=10},
  {id:"50grabs",name:"抓娃娃达人",desc:"累计抓到50个",icon:"🏅",check:()=>stats.totalGrabs>=50},
  {id:"combo3",name:"连击新星",desc:"达成3连击",icon:"⚡",check:()=>stats.maxCombo>=3},
  {id:"combo5",name:"连击大师",desc:"达成5连击",icon:"🔥",check:()=>stats.maxCombo>=5},
  {id:"lv5",name:"步步高升",desc:"达到Lv.5",icon:"📈",check:()=>stats.maxLevel>=5},
  {id:"lv10",name:"高手过招",desc:"达到Lv.10",icon:"🚀",check:()=>stats.maxLevel>=10},
  {id:"all7",name:"全部收集",desc:"收集全部7种娃娃",icon:"🌟",check:()=>collected.size>=7},
  {id:"score500",name:"半千分",desc:"单局得分超过500",icon:"💰",check:()=>stats.totalScore>=500},
  {id:"games10",name:"常客",desc:"玩过10局",icon:"🔄",check:()=>stats.totalGames>=10},
];
let earnedAch=new Set(JSON.parse(localStorage.getItem("clawAch")||"[]"));

function checkAchievements(){
  for(const a of ACHIEVEMENTS){
    if(!earnedAch.has(a.id)&&a.check()){
      earnedAch.add(a.id);
      localStorage.setItem("clawAch",JSON.stringify([...earnedAch]));
      showToast("成就解锁: "+a.icon+" "+a.name);
      sfxPowerup();spawnConfetti(30);
    }
  }
}

function updStats(){
  const g=document.getElementById("statsGrid");
  g.innerHTML=[
    ["总抓取",stats.totalGrabs],["总失误",stats.totalMiss],["总游戏",stats.totalGames],
    ["总得分",stats.totalScore],["最高连击",stats.maxCombo],["最高等级",stats.maxLevel],
    ["成功率",stats.totalGrabs+stats.totalMiss>0?Math.round(stats.totalGrabs/(stats.totalGrabs+stats.totalMiss)*100)+"%":"--"],
    ["收集",collected.size+"/"+TYPES.length],
  ].map(([l,v])=>`<div class="stat-item"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");

  const al=document.getElementById("achList");
  al.innerHTML=ACHIEVEMENTS.map(a=>`<span class="ach-item ${earnedAch.has(a.id)?"earned":"locked"}" title="${a.desc}">${a.icon} ${a.name}</span>`).join("");
}

// Stars background
for(let i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,sz:Math.random()*2+.5,sp:Math.random()*.5+.2,bright:Math.random()});

function wRand(types){
  const tw=types.reduce((s,t)=>s+t.w,0);let r=Math.random()*tw;
  for(const t of types){r-=t.w;if(r<=0)return t}return types[0];
}

function initPrizes(){
  prizes=[];
  const n=14+Math.floor(Math.random()*6);
  const fl=H-42;
  // Higher levels adjust weights to include more rare prizes
  const adjTypes=TYPES.map(t=>({...t,w:t.w*(1+level*.05*(t.pts>=50?2:1))}));
  for(let i=0;i<n;i++){
    const t=wRand(adjTypes);
    prizes.push({x:40+Math.random()*(W-80),y:fl-Math.random()*90-t.sz,...t,vx:0,vy:0,rot:Math.random()*Math.PI*2,settled:true});
  }
}

function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}

function showCombo(c){
  const d=document.getElementById("comboDisp");
  d.textContent="x"+c+" COMBO!";
  d.classList.remove("active");
  void d.offsetWidth;
  d.classList.add("active");
  setTimeout(()=>d.classList.remove("active"),1500);
}

function updHUD(){
  document.getElementById("hCoins").textContent=coins;
  document.getElementById("hScore").textContent=score;
  document.getElementById("hHigh").textContent=highScore;
  document.getElementById("hLevel").textContent=level;
  document.getElementById("hCombo").textContent=combo;
}

function updGallery(){
  const g=document.getElementById("gallery");g.innerHTML="";
  TYPES.forEach(t=>{
    const d=document.createElement("div");
    d.className="gi "+(collected.has(t.emoji)?"unlocked":"locked");
    d.innerHTML=t.emoji+'<span class="pts">'+t.pts+'</span>';
    d.title=t.name+" ("+t.pts+"分)";
    g.appendChild(d);
  });
  localStorage.setItem("clawColl",JSON.stringify([...collected]));
}

// Confetti system
let confetti=[];
function spawnConfetti(count){
  const cols=["#ffd200","#f7971e","#e74c3c","#3498db","#2ecc71","#9b59b6","#e67e22"];
  for(let i=0;i<count;i++){
    confetti.push({
      x:Math.random()*W,y:-10-Math.random()*40,
      vx:(Math.random()-.5)*4,vy:Math.random()*3+2,
      rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.15,
      w:4+Math.random()*6,h:3+Math.random()*4,
      col:cols[Math.floor(Math.random()*cols.length)],
      life:1,dec:.003+Math.random()*.002
    });
  }
}

// Particles
function spawnP(x,y,col,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-1)*6,life:1,dec:.02+Math.random()*.03,sz:2+Math.random()*4,col})}
function addFloat(x,y,txt,col){floatTexts.push({x,y,txt,col,life:1,vy:-2})}

function updParticles(){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=p.dec;if(p.life<=0)particles.splice(i,1)}
  for(let i=floatTexts.length-1;i>=0;i--){const f=floatTexts[i];f.y+=f.vy;f.life-=.015;if(f.life<=0)floatTexts.splice(i,1)}
  for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.x+=c.vx;c.y+=c.vy;c.rot+=c.rotV;c.vx*=.99;c.life-=c.dec;if(c.life<=0||c.y>H+20)confetti.splice(i,1)}
}

function drawConfetti(){
  for(const c of confetti){
    cx.save();cx.translate(c.x,c.y);cx.rotate(c.rot);
    cx.globalAlpha=c.life;cx.fillStyle=c.col;
    cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    cx.restore();
  }
  cx.globalAlpha=1;
}

// Decorative machine lights
function drawLights(){
  const cols=["#e74c3c","#f1c40f","#2ecc71","#3498db","#9b59b6"];
  for(let i=0;i<10;i++){
    const lx=20+i*(W-40)/9;
    const phase=Math.sin(frameCount*.03+i*.7)*.5+.5;
    const col=cols[i%cols.length];
    cx.save();
    cx.globalAlpha=.3+phase*.5;
    cx.fillStyle=col;
    cx.shadowColor=col;cx.shadowBlur=6;
    cx.beginPath();cx.arc(lx,15,3,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;cx.restore();
  }
  // Bottom lights
  for(let i=0;i<10;i++){
    const lx=20+i*(W-40)/9;
    const phase=Math.sin(frameCount*.03+i*.7+Math.PI)*.5+.5;
    const col=cols[(i+2)%cols.length];
    cx.save();
    cx.globalAlpha=.3+phase*.5;
    cx.fillStyle=col;
    cx.shadowColor=col;cx.shadowBlur=6;
    cx.beginPath();cx.arc(lx,H-13,3,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;cx.restore();
  }
}

// Drawing
function drawBg(){
  // Subtle background gradient shift based on level
  const hue=(level*15)%360;
  const bgGrad=cx.createRadialGradient(W/2,H/2,50,W/2,H/2,W);
  bgGrad.addColorStop(0,`hsla(${hue},30%,12%,.3)`);
  bgGrad.addColorStop(1,"transparent");
  cx.fillStyle=bgGrad;cx.fillRect(0,0,W,H);
  // Animated stars
  frameCount++;
  for(const s of stars){
    s.bright=.3+Math.sin(frameCount*.02+s.x)*0.4;
    cx.globalAlpha=s.bright;
    cx.fillStyle="#fff";
    cx.beginPath();cx.arc(s.x,s.y,s.sz,0,Math.PI*2);cx.fill();
  }
  cx.globalAlpha=1;
  // Walls with level-based glow
  const wallAlpha=.1+Math.sin(frameCount*.01)*.03;
  cx.strokeStyle=`rgba(255,255,255,${wallAlpha})`;cx.lineWidth=2;cx.strokeRect(10,10,W-20,H-20);
  // Rail
  const rg=cx.createLinearGradient(10,40,W-10,40);rg.addColorStop(0,"#333");rg.addColorStop(.5,"#555");rg.addColorStop(1,"#333");
  cx.fillStyle=rg;cx.fillRect(10,38,W-20,8);
  // Rail bolts
  for(let bx=30;bx<W-20;bx+=60){cx.fillStyle="#777";cx.beginPath();cx.arc(bx,42,3,0,Math.PI*2);cx.fill()}
  // Floor
  const fg=cx.createLinearGradient(0,H-42,0,H-10);fg.addColorStop(0,"#2d2d5e");fg.addColorStop(1,"#1a1a3e");
  cx.fillStyle=fg;cx.fillRect(10,H-42,W-20,32);
  // Exit zone
  cx.fillStyle="rgba(247,151,30,.12)";cx.fillRect(W-85,H-42,75,32);
  cx.strokeStyle="#f7971e";cx.lineWidth=1;cx.setLineDash([4,4]);cx.strokeRect(W-85,H-42,75,32);cx.setLineDash([]);
  cx.fillStyle="#f7971e";cx.font="bold 11px sans-serif";cx.textAlign="center";cx.fillText("出口 ↓",W-47,H-22);
}

function drawRope(){
  const sx=claw.x+Math.sin(claw.swing)*8;
  cx.strokeStyle="#777";cx.lineWidth=2;
  cx.beginPath();cx.moveTo(claw.x,44);
  // Slight curve for swing
  cx.quadraticCurveTo(sx,claw.y/2+20,sx,claw.y-12);
  cx.stroke();
  // Pulley
  cx.fillStyle="#888";cx.beginPath();cx.arc(claw.x,44,5,0,Math.PI*2);cx.fill();
  cx.strokeStyle="#666";cx.stroke();
}

function drawClaw(){
  const sx=claw.x+Math.sin(claw.swing)*8;
  const cy=claw.y;
  const op=claw.open;
  // Head
  cx.fillStyle="#d0d0d0";cx.beginPath();cx.arc(sx,cy-8,9,0,Math.PI*2);cx.fill();
  cx.strokeStyle="#999";cx.lineWidth=1;cx.stroke();
  // 3 prongs
  const angles=[-op,0,op];
  const offsets=[[-5,0],[0,2],[5,0]];
  for(let i=0;i<3;i++){
    cx.save();cx.translate(sx+offsets[i][0],cy+offsets[i][1]);
    cx.rotate(angles[i]*(i===1?.3:1));
    const grad=cx.createLinearGradient(0,0,0,28);grad.addColorStop(0,"#bbb");grad.addColorStop(1,"#888");
    cx.fillStyle=grad;
    cx.beginPath();cx.moveTo(-3,0);cx.lineTo(-6,26);cx.quadraticCurveTo(0,30,6,26);cx.lineTo(3,0);cx.closePath();
    cx.fill();cx.strokeStyle="#777";cx.lineWidth=.5;cx.stroke();
    cx.restore();
  }
  if(claw.grabbed){claw.grabbed.x=sx;claw.grabbed.y=cy+33}
}

function drawPrizes(){
  cx.textAlign="center";cx.textBaseline="middle";
  for(const p of prizes){
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
    // Glow for rare
    if(p.w<=.5){
      cx.shadowColor=p.color;cx.shadowBlur=10+Math.sin(frameCount*.05)*5;
    }
    cx.font=p.sz+"px sans-serif";cx.fillText(p.emoji,0,0);
    cx.shadowBlur=0;cx.restore();
  }
}

function drawParticles(){
  for(const p of particles){cx.globalAlpha=p.life;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.sz,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;
  cx.textAlign="center";
  for(const f of floatTexts){cx.globalAlpha=f.life;cx.fillStyle=f.col;cx.font="bold 18px sans-serif";cx.fillText(f.txt,f.x,f.y)}
  cx.globalAlpha=1;
}

// Game over session stats
let sessionGrabs=0,sessionMisses=0,sessionMaxCombo=0;

function drawGameOver(){
  if(!gameOver)return;
  cx.fillStyle="rgba(0,0,0,.8)";cx.fillRect(0,0,W,H);

  // Title
  cx.fillStyle="#ffd200";cx.font="bold 32px sans-serif";cx.textAlign="center";
  cx.fillText(gameMode==="challenge"?"时间到!":"游戏结束!",W/2,H/2-80);

  // Score with glow
  cx.shadowColor="#ffd200";cx.shadowBlur=15;
  cx.fillStyle="#fff";cx.font="bold 42px sans-serif";
  cx.fillText(score,W/2,H/2-35);
  cx.shadowBlur=0;
  cx.fillStyle="#aaa";cx.font="13px sans-serif";
  cx.fillText("分",W/2+40,H/2-35);

  // Stats summary
  const ly=H/2+5;
  cx.font="14px sans-serif";
  cx.fillStyle="#8e8ea0";
  const rate=sessionGrabs+sessionMisses>0?Math.round(sessionGrabs/(sessionGrabs+sessionMisses)*100):0;
  cx.fillText(`抓到 ${sessionGrabs} | 失误 ${sessionMisses} | 成功率 ${rate}%`,W/2,ly);
  cx.fillText(`最高连击 x${sessionMaxCombo} | 等级 Lv.${level}`,W/2,ly+22);

  // High score indicator
  if(score>=highScore&&score>0){
    cx.fillStyle="#ffd200";cx.font="bold 16px sans-serif";
    cx.fillText("🏆 新纪录!",W/2,ly+50);
  }else{
    cx.fillStyle="#666";cx.font="14px sans-serif";
    cx.fillText("最高: "+highScore,W/2,ly+50);
  }

  // Restart hint with pulse
  const pulse=.5+Math.sin(frameCount*.05)*.3;
  cx.globalAlpha=pulse;
  cx.fillStyle="#ffd200";cx.font="bold 15px sans-serif";
  cx.fillText("按 R 或 空格 重新开始",W/2,ly+80);
  cx.globalAlpha=1;
}

// Logic
function moveClaw(){
  if(claw.state!=="idle")return;
  let moved=false;
  const spd=claw.speed+Math.min(level*.15,2);
  if(keys.ArrowLeft||keys.a){claw.x=Math.max(40,claw.x-spd);moved=true}
  if(keys.ArrowRight||keys.d){claw.x=Math.min(W-40,claw.x+spd);moved=true}
  if(moved&&frameCount%4===0)sfxMove();
  // Swing physics
  claw.swingV+=(moved?(keys.ArrowLeft?-.02:.02):0)-claw.swing*.05;
  claw.swingV*=.92;
  claw.swing+=claw.swingV;
}

function dropClaw(){
  if(claw.state!=="idle"||gameOver)return;
  if(coins<=0){gameOver=true;sfxGameOver();showToast("没有硬币了!");return}
  initAudio();
  coins--;updHUD();sfxDrop();
  claw.state="dropping";claw.open=.7;
  let ty=H-72;
  for(const p of prizes){if(Math.abs(p.x-claw.x)<28&&p.y-28<ty)ty=p.y-18}
  claw.targetY=ty;
}

function updClaw(){
  const dropChance=.003+level*.001;
  if(claw.state==="dropping"){
    claw.y+=4.5;claw.swing*=.95;
    if(claw.y>=claw.targetY){claw.y=claw.targetY;claw.state="grabbing";claw.grabTimer=18;shakeT=8}
  }else if(claw.state==="grabbing"){
    claw.open=Math.max(.08,claw.open-.045);claw.grabTimer--;
    if(claw.grabTimer<=0){tryGrab();claw.state="rising"}
  }else if(claw.state==="rising"){
    claw.y-=3;
    if(claw.grabbed&&powerups.grip<=0&&Math.random()<dropChance){
      const p=claw.grabbed;claw.grabbed=null;p.vy=2;p.settled=false;
      sfxFail();showToast("掉了! 😢");shakeT=8;combo=0;updHUD();
    }
    if(claw.y<=60){
      claw.y=60;
      if(claw.grabbed){claw.state="toExit"}
      else{finishTurn()}
    }
  }else if(claw.state==="toExit"){
    const tx=W-47;
    if(Math.abs(claw.x-tx)>3)claw.x+=(tx>claw.x?3:-3);
    else{
      if(claw.grabbed){
        const p=claw.grabbed;
        combo++;
        const mult=Math.min(combo,5);
        let pts=p.pts*mult;
        if(powerups.double>0)pts*=2;
        score+=pts;
        if(score>highScore){highScore=score;localStorage.setItem("clawHS",""+highScore)}
        const prevLevel=level;
        level=Math.floor(score/100)+1;
        if(level>prevLevel){spawnConfetti(60);showToast("升级! Lv."+level+" 🎉");sfxPowerup()}
        collected.add(p.emoji);
        spawnP(p.x,p.y,p.color,25);
        addFloat(p.x,p.y-20,"+"+pts,p.color);
        sfxWin();
        if(combo>=2)showCombo(combo);
        if(combo>0&&combo%3===0){coins++;sfxCoin();showToast("连击奖励 +1 🪙!")}
        else showToast("抓到 "+p.emoji+" "+p.name+"! +"+pts+"分");
        const idx=prizes.indexOf(p);if(idx>=0)prizes.splice(idx,1);
        claw.grabbed=null;
        sessionGrabs++;stats.totalGrabs++;stats.totalScore=Math.max(stats.totalScore,score);
        if(combo>sessionMaxCombo)sessionMaxCombo=combo;
        if(combo>stats.maxCombo)stats.maxCombo=combo;
        if(level>stats.maxLevel)stats.maxLevel=level;
        stats.prizeCounts[p.emoji]=(stats.prizeCounts[p.emoji]||0)+1;
        saveStats();checkAchievements();updStats();
        updHUD();updGallery();
      }
      claw.state="returning";
    }
  }else if(claw.state==="returning"){
    const tx=W/2;
    if(Math.abs(claw.x-tx)>3)claw.x+=(tx>claw.x?3:-3);
    else{claw.x=tx;finishTurn()}
  }
}

function finishTurn(){
  claw.state="idle";claw.open=.5;
  if(coins<=0){gameOver=true;sfxGameOver();showToast("游戏结束! 得分: "+score);stats.totalGames++;saveStats();checkAchievements();updStats()}
  if(prizes.length<6){initPrizes();showToast("补充新娃娃!")}
}

function tryGrab(){
  const sx=claw.x+Math.sin(claw.swing)*8;
  let best=null,bd=Infinity;
  for(const p of prizes){
    const d=Math.abs(p.x-sx)+Math.abs(p.y-(claw.y+28));
    if(d<30&&d<bd){best=p;bd=d}
  }
  if(best){
    let ch=best.w>1?.88:best.w>.5?.68:.42;
    if(powerups.grip>0)ch=Math.min(ch+.35,1);
    if(Math.random()<ch){claw.grabbed=best;sfxGrab();showToast("抓住了! 🎉")}
    else{sfxFail();showToast("没抓稳... 😅");shakeT=10;combo=0;sessionMisses++;stats.totalMiss++;saveStats();updStats();updHUD()}
  }else{combo=0;updHUD()}
}

function physics(){
  const fl=H-42;
  for(const p of prizes){
    if(p===claw.grabbed)continue;
    if(!p.settled){
      p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.rot+=p.vx*.02;
      if(p.y+p.sz/2>fl){p.y=fl-p.sz/2;p.vy*=-.25;p.vx*=.7;if(Math.abs(p.vy)<.5){p.vy=0;p.settled=true}}
      if(p.x<20){p.x=20;p.vx*=-.5}
      if(p.x>W-20){p.x=W-20;p.vx*=-.5}
      // Bounce off other prizes
      for(const q of prizes){
        if(q===p||q===claw.grabbed)continue;
        const dx=p.x-q.x,dy=p.y-q.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<(p.sz+q.sz)*.4&&dist>0){
          const nx=dx/dist,ny=dy/dist;
          p.vx+=nx*.5;p.vy+=ny*.3;
          if(q.settled){q.vx=(q.vx||0)-nx*.2;q.vy=-1;q.settled=false}
        }
      }
    }
  }
}

// Power-up system
const PU_TYPES=[
  {emoji:"💪",name:"强力爪",key:"grip",color:"#e74c3c",dur:300},
  {emoji:"🧲",name:"磁力",key:"magnet",color:"#3498db",dur:240},
  {emoji:"💎",name:"双倍",key:"double",color:"#9b59b6",dur:180},
];

function maybeSpawnPU(){
  if(puItems.length>=2||Math.random()>.003)return;
  const t=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
  puItems.push({x:60+Math.random()*(W-120),y:H-80-Math.random()*60,...t,bobOff:Math.random()*Math.PI*2});
}

function drawPU(){
  for(const p of puItems){
    const by=p.y+Math.sin(frameCount*.04+p.bobOff)*5;
    cx.save();cx.translate(p.x,by);
    cx.shadowColor=p.color;cx.shadowBlur=12+Math.sin(frameCount*.06)*4;
    cx.font="22px sans-serif";cx.textAlign="center";cx.textBaseline="middle";
    cx.fillText(p.emoji,0,0);
    cx.shadowBlur=0;cx.restore();
  }
}

function updPowerups(){
  for(const k of ["grip","magnet","double"]){
    if(powerups[k]>0){powerups[k]--;document.getElementById("pu"+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle("active",powerups[k]>0)}
    else document.getElementById("pu"+k.charAt(0).toUpperCase()+k.slice(1)).classList.remove("active");
  }
  // Magnet effect: pull nearby prizes toward claw
  if(powerups.magnet>0&&claw.state==="idle"){
    for(const p of prizes){
      const dx=claw.x-p.x;
      if(Math.abs(dx)<80){p.x+=dx*.01;p.settled=false}
    }
  }
}

function checkPUCollect(){
  if(!claw.grabbed)return;
  for(let i=puItems.length-1;i>=0;i--){
    const p=puItems[i];
    const dx=claw.x-p.x,dy=(claw.y+30)-p.y;
    if(Math.abs(dx)<20&&Math.abs(dy)<20){
      powerups[p.key]+=p.dur;
      sfxPowerup();
      spawnP(p.x,p.y,p.color,15);
      addFloat(p.x,p.y-15,p.name+"!",p.color);
      puItems.splice(i,1);
    }
  }
}

// Targeting guide line
function drawGuide(){
  if(claw.state!=="idle"||gameOver)return;
  cx.save();
  cx.strokeStyle="rgba(255,210,0,.15)";cx.lineWidth=1;cx.setLineDash([4,8]);
  cx.beginPath();cx.moveTo(claw.x,claw.y+30);cx.lineTo(claw.x,H-42);cx.stroke();
  cx.setLineDash([]);
  // Show nearest prize indicator
  let best=null,bd=Infinity;
  for(const p of prizes){
    const d=Math.abs(p.x-claw.x);if(d<30&&d<bd){best=p;bd=d}
  }
  if(best){
    cx.strokeStyle="rgba(255,210,0,.25)";cx.lineWidth=2;
    cx.beginPath();cx.arc(best.x,best.y,best.sz*.7,0,Math.PI*2);cx.stroke();
  }
  cx.restore();
}

// Timer for challenge mode
function updTimer(){
  if(gameMode!=="challenge"||gameOver)return;
  const now=Date.now();
  if(now-lastTimerTick>=1000){
    lastTimerTick=now;timer--;
    document.getElementById("hTime").textContent=timer;
    if(timer<=10)sfxTick();
    if(timer<=0){gameOver=true;sfxGameOver();showToast("时间到! 得分: "+score)}
  }
}

// Main loop
function update(){moveClaw();updClaw();physics();updParticles();maybeSpawnPU();updPowerups();checkPUCollect();updTimer();if(shakeT>0)shakeT--}

function draw(){
  cx.clearRect(0,0,W,H);
  cx.save();
  if(shakeT>0)cx.translate((Math.random()-.5)*5,(Math.random()-.5)*5);
  drawBg();drawLights();drawGuide();drawPrizes();drawPU();drawRope();drawClaw();drawParticles();drawConfetti();drawGameOver();
  cx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop)}

function reset(){
  coins=gameMode==="zen"?999:gameMode==="challenge"?10:5;
  score=0;combo=0;level=1;gameOver=false;shakeT=0;
  sessionGrabs=0;sessionMisses=0;sessionMaxCombo=0;
  timer=60;lastTimerTick=Date.now();
  powerups={grip:0,magnet:0,double:0};puItems=[];
  document.getElementById("hTimer").style.display=gameMode==="challenge"?"inline":"none";
  document.getElementById("hTime").textContent=timer;
  claw={x:W/2,y:60,open:.5,state:"idle",targetY:0,grabbed:null,speed:3,grabTimer:0,swing:0,swingV:0};
  particles=[];floatTexts=[];initPrizes();updHUD();updGallery();
}

function setMode(m){
  gameMode=m;
  document.querySelectorAll(".mode-bar button").forEach(b=>b.classList.remove("active"));
  document.getElementById(m==="normal"?"mNormal":m==="challenge"?"mChallenge":"mZen").classList.add("active");
  reset();
}

// Input
document.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key===" "||e.key==="ArrowDown"){e.preventDefault();if(gameOver)reset();else dropClaw()}
  if(e.key==="r"||e.key==="R")reset();
});
document.addEventListener("keyup",e=>{keys[e.key]=false});

// Touch/mouse buttons
function bind(id,k){
  const b=document.getElementById(id);
  const on=()=>{keys[k]=true};const off=()=>{keys[k]=false};
  b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
  b.addEventListener("touchstart",e=>{e.preventDefault();on()},{passive:false});b.addEventListener("touchend",off);
}
bind("bL","ArrowLeft");bind("bR","ArrowRight");
document.getElementById("bD").addEventListener("click",()=>{initAudio();dropClaw()});
document.getElementById("bRs").addEventListener("click",reset);
document.getElementById("statsBtn").addEventListener("click",()=>{document.getElementById("statsPanel").classList.toggle("open");updStats()});
document.getElementById("mNormal").addEventListener("click",()=>setMode("normal"));
document.getElementById("mChallenge").addEventListener("click",()=>setMode("challenge"));
document.getElementById("mZen").addEventListener("click",()=>setMode("zen"));

// Mode keys
document.addEventListener("keydown",e=>{
  if(e.key==="1")setMode("normal");
  if(e.key==="2")setMode("challenge");
  if(e.key==="3")setMode("zen");
});

// Init
initPrizes();updHUD();updGallery();updStats();loop();
</script>
